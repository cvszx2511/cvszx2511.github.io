<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<style>
.wl,.wr{transform-origin:50px 52px;animation:flap .5s ease-in-out infinite alternate}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes flap{to{transform:scaleX(.28)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="b" cx="35%" cy="45%" r="75%"><stop offset="0" stop-color="#A6F0FF"/><stop offset=".45" stop-color="#2E9DF2"/><stop offset="1" stop-color="#1546B8"/></radialGradient>
<g id="w" stroke="#16213E" stroke-width="3" stroke-linejoin="round">
<path d="M50 50C40 26 18 12 9 22C2 31 10 48 24 52C34 55 44 54 50 52Z" fill="url(#b)"/>
<path d="M50 54C40 56 26 60 22 72C19 82 28 90 37 85C45 80 49 66 50 56Z" fill="url(#b)"/>
<circle cx="13" cy="27" r="1.8" fill="#fff" stroke="none"/><circle cx="18" cy="21" r="1.3" fill="#fff" stroke="none"/><circle cx="28" cy="81" r="1.5" fill="#fff" stroke="none"/>
</g>
</defs>
<g class="bob">
<g class="wl"><use href="#w"/></g>
<g class="wr"><use href="#w" transform="matrix(-1 0 0 1 100 0)"/></g>
<ellipse cx="50" cy="58" rx="3.4" ry="16" fill="#2B2522"/>
<circle cx="50" cy="40" r="4.4" fill="#2B2522"/>
<path d="M48.5 37C46 28 42 24 37 22M51.5 37C54 28 58 24 63 22" stroke="#2B2522" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<circle cx="37" cy="22" r="2" fill="#2B2522"/><circle cx="63" cy="22" r="2" fill="#2B2522"/>
</g>
</svg>
